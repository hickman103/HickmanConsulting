<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work with Me | Hickman Consulting LLC</title>
    <meta
      name="description"
      content="Start a conversation with Hickman Consulting LLC about speaking, PD, coaching, consulting, or a district partnership."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=4" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="index.html" aria-label="Hunter Hickman home">
          <span class="brand-mark">
            <img src="assets/ai-classroom-logo.png" alt="AI Classroom logo" />
          </span>
          <span class="brand-copy">
            <strong>Hunter Hickman</strong>
            <span>Educator. Coach. Consultant.</span>
          </span>
        </a>
        <nav class="site-nav">
          <a href="index.html">Home</a>
          <a href="pilot-partnerships.html">Partnerships</a>
          <a class="current" href="inquiry.html">Work with Me</a>
        </nav>
      </header>

      <main>
        <section class="page-hero">
          <h1>Let's talk.</h1>
          <p class="hero-text">
            Tell me a little about your school or district and what you're trying to figure out.
            I read every message and reply personally.
          </p>
        </section>

        <section class="section">
          <form id="inquiry-form" class="inquiry-form" method="POST">
            <div class="field-row">
              <label>
                Name
                <input type="text" name="name" autocomplete="name" required />
              </label>
              <label>
                Organization
                <input type="text" name="organization" autocomplete="organization" required />
              </label>
            </div>

            <div class="field-row">
              <label>
                Email
                <input type="email" name="email" autocomplete="email" required />
              </label>
              <label>
                Role
                <input type="text" name="role" placeholder="Superintendent, principal, coach, etc." />
              </label>
            </div>

            <label>
              What are you interested in?
              <select name="interest" required>
                <option value="">Select one</option>
                <option>Speaking / PD Day</option>
                <option>Coaching</option>
                <option>Consulting</option>
                <option>Pilot Partnership</option>
                <option>Founding Partnership</option>
                <option>Not sure yet</option>
              </select>
            </label>

            <label>
              What would you like support with?
              <textarea
                name="message"
                rows="6"
                placeholder="Tell me about your goals, current challenges, or the kind of engagement you're considering."
                required
              ></textarea>
            </label>

            <div class="form-actions">
              <button class="button button-primary" type="submit">Send Inquiry</button>
              <p class="form-note" id="form-status" aria-live="polite"></p>
            </div>
          </form>
        </section>
      </main>
